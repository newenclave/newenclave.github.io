<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>Tower Defence</title>
<style>
  :root { --bg:#14181f; --panel:#1d2430; --panel2:#283243; --txt:#e8ecf2; --dim:#8b97a8; --acc:#4da8da; --good:#6bd36b; --bad:#e63946; --gold:#ffd166; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #hud { display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--panel); font-weight:700; min-height:44px; }
  #hud .stat { white-space:nowrap; min-width:46px; }
  #hLives { color:#ff7b8a; } #hGold { color:var(--gold); } #hWave { color:var(--acc); }
  #hud .sp { flex:1; }
  .ib { background:var(--panel2); color:var(--txt); border:0; border-radius:8px; min-width:36px; height:32px; padding:0 8px; font-size:13px; font-weight:700; }
  .ib.on { background:var(--acc); color:#06121c; }
  .ib:active { filter:brightness(1.3); }
  @media (max-width:400px) {
    #hud { gap:4px; padding:6px 6px; }
    #hud .stat { flex:none; min-width:0; font-size:13px; }
    .ib { flex:none; min-width:0; padding:0 7px; font-size:12px; }
  }
  @media (max-width:340px) {
    #hud .stat { font-size:12px; }
    .ib { padding:0 5px; font-size:11px; }
  }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#0d1015; }
  canvas#cv { width:min(100%, calc((100dvh - 210px) * 360 / 520)); aspect-ratio:360/520; display:block; touch-action:none; }
  #info { height:88px; padding:6px 8px; background:var(--panel); border-top:1px solid #000; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  #info .brow { display:flex; gap:5px; }
  #info .brow .btn { flex:1; padding:5px 2px; font-size:12px; line-height:1.15; min-width:0; }
  #info .txt { flex:1; font-size:13px; min-width:0; }
  #info .txt b { font-size:14px; }
  small { color:var(--dim); }
  .btn { background:var(--acc); color:#06121c; border:0; border-radius:8px; padding:8px 10px; font-weight:700; font-size:13px; }
  .btn.alt { background:var(--panel2); color:var(--txt); }
  .btn.red { background:var(--bad); color:#fff; }
  .btn:disabled { opacity:.35; }
  .btn:active:not(:disabled) { filter:brightness(1.2); }
  #bar { display:flex; gap:4px; padding:6px; background:var(--panel); }
  #shop { flex:1; display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none; }
  #shop::-webkit-scrollbar { display:none; }
  .card { flex:1 0 44px; min-width:44px; padding:3px 0; background:var(--panel2); border:1px solid transparent; border-radius:8px; color:var(--txt); text-align:center; font-size:9px; letter-spacing:-.2px; overflow:hidden; white-space:nowrap; }
  .card canvas { width:22px; height:22px; display:block; margin:0 auto; }
  .card .c { color:var(--gold); font-weight:700; font-size:10px; }
  .card .k { color:#9db4ff; font-size:9px; }
  .card.full { opacity:.55; }
  .card.armed { border-color:var(--acc); }
  .card.poor .c { color:var(--bad); }
  .card.locked { opacity:.35; }
  #abil { display:none; gap:6px; padding:4px 6px; background:var(--panel); border-top:1px solid #000; }
  #app.ab #abil { display:flex; }
  #app.ab canvas#cv { width:min(100%, calc((100dvh - 252px) * 360 / 520)); }
  .ab { flex:1; }
  button.ab { background:var(--panel2); color:var(--txt); border:0; border-radius:8px; height:34px; font-weight:700; font-size:13px; }
  button.ab:disabled { opacity:.45; }
  button.ab:not(:disabled) { background:#7a5cff; }
  #ab_rain.active:disabled { background:#ffd166; color:#06121c; opacity:1; }
  #ab_freeze.active:disabled { background:#9bf6ff; color:#06121c; opacity:1; }
  #bGo { flex:0 0 54px; padding:8px 2px; font-size:13px; }
  #ov { position:fixed; inset:0; background:rgba(8,10,14,.94); display:none; overflow-y:auto; padding:20px 16px; }
  #ov .box { max-width:420px; margin:0 auto; }
  #ov h1 { margin:8px 0 2px; text-align:center; font-size:26px; letter-spacing:.06em; }
  #ov h3 { margin:18px 0 6px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  #ov .sub { text-align:center; color:var(--dim); margin-bottom:14px; }
  #ov .big { width:100%; padding:14px; font-size:18px; margin:6px 0; }
  #ov .mwrap { display:flex; flex-direction:column; height:calc(100dvh - 40px); }
  #ov .mhead h1 { margin:0; font-size:22px; }
  #ov .mhead .sub { margin:2px 0 10px; }
  .tabs { display:flex; gap:4px; margin-bottom:10px; }
  .tab { flex:1; position:relative; background:var(--panel); color:var(--dim); border:0; border-radius:8px; padding:10px 0; font-size:12px; font-weight:700; }
  .tab.on { background:var(--acc); color:#06121c; }
  .tab i { position:absolute; top:4px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--gold); }
  /* the lists still scroll (wheel, touch) but show no scrollbar, which on desktop covered the buttons */
  .mbody, #ov { scrollbar-width:none; }
  .mbody::-webkit-scrollbar, #ov::-webkit-scrollbar { display:none; }
  .mbody { flex:1; min-height:0; overflow-y:auto; }
  .mbody h3:first-child { margin-top:0; }
  .mfoot { padding-top:10px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border-radius:10px; margin-bottom:6px; }
  .row .t { flex:1; }
  .row .t small { display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="stat" id="hLives">HP 20</span>
    <span class="stat" id="hGold">$ 0</span>
    <span class="stat" id="hWave">W 0</span>
    <span class="sp"></span>
    <button class="ib" id="bSpeed">x1</button>
    <button class="ib" id="bAuto">Auto</button>
    <button class="ib" id="bPause">II</button>
    <button class="ib" id="bQuit">X</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="info"></div>
  <div id="abil"></div>
  <div id="bar"><div id="shop"></div><button class="btn" id="bGo">Start</button></div>
</div>
<div id="ov"><div class="box" id="ovBox"></div></div>
<script src="game.js"></script>
</body>
</html>
